<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#13251f">
  <title>Football Tournament Manager</title>
  <link rel="stylesheet" href="styles.css?v=20260730-6">
</head>
<body>
  <header class="topbar">
    <button class="brand brand-button" data-action="home"><span class="brand-mark">⚽</span><span><strong>Football</strong><small>Tournament Manager</small></span></button>
    <div class="header-actions">
      <button id="headerMenuButton" class="btn ghost header-menu-button" data-action="toggle-header-menu" aria-expanded="false" aria-controls="headerMenu">☰ Menu</button>
      <div id="headerMenu" class="header-menu">
      <span id="roleBadge" class="role-badge">Organizzatore</span>
      <button id="userName" class="user-name admin-only" data-action="open-profile" hidden></button>
      <label class="language-picker" aria-label="Lingua"><span>🌐</span><select id="languageSelect"><option value="it">IT</option><option value="en">EN</option></select></label>
      <button id="themeButton" class="btn ghost" data-action="toggle-theme" aria-label="Cambia tema">🌙 Scuro</button>
      <button id="experienceButton" class="btn ghost admin-only tournament-only" data-action="toggle-experience">Modalità guidata</button>
      <button id="accessButton" class="btn ghost" data-action="public-view">Vista pubblica</button>
      <button class="btn ghost admin-only" data-action="share">Condividi / QR</button>
      <button class="btn ghost admin-only" data-action="logout">Esci</button>
      <span id="saveState" class="save-state admin-only">● Sincronizzato online</span>
      <button class="btn ghost admin-only" data-action="export">Esporta</button>
      <label class="btn ghost file-btn admin-only">Importa<input id="importFile" type="file" accept=".json,application/json"></label>
      <button class="btn danger ghost admin-only" data-action="reset">Reset</button>
      </div>
    </div>
  </header>

  <div class="app-shell">
    <nav id="nav" class="sidebar" aria-label="Sezioni">
      <button data-action="home"><span>📁</span> I miei tornei</button>
      <button class="tournament-only" data-view="dashboard"><span>⌂</span> Dashboard</button>
      <button class="admin-only tournament-only" data-view="registrations"><span>＋</span> Iscrizioni</button>
      <button class="admin-only tournament-only" data-view="teams"><span>♟</span> Squadre</button>
      <button class="admin-only tournament-only" data-view="format"><span>◇</span> Formato</button>
      <button class="tournament-only" data-view="groups"><span>▦</span> Gironi</button>
      <button class="tournament-only" data-view="matches"><span>▤</span> Partite</button>
      <button class="tournament-only" data-view="knockout"><span>⌁</span> Fase finale</button>
      <button class="tournament-only" data-view="stats"><span>↗</span> Statistiche</button>
      <button class="tournament-only" data-view="rules"><span>ⓘ</span> Regolamento</button>
    </nav>
    <main id="main" class="main"></main>
  </div>

  <div id="modal" class="modal" hidden>
    <div class="modal-card" role="dialog" aria-modal="true">
      <button class="modal-close" data-action="close-modal" aria-label="Chiudi">×</button>
      <div id="modalBody"></div>
    </div>
  </div>
  <div id="toast" class="toast" hidden></div>
  <script src="qrcode.js?v=1.4.4"></script>
  <script src="app.js?v=20260730-6"></script>
</body>
</html>
